name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows / MSVC hosted CI gate
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      RG_CORE_DIR: ${{ github.workspace }}\_deps\rg_core
      RG_TEXT_DIR: ${{ github.workspace }}\_deps\rg_text

    steps:
      - name: Check out rg_gui
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out rg_core dependency
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: superwendel/rg_core
          path: _deps/rg_core
          persist-credentials: false

      - name: Check out rg_text dependency
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: superwendel/rg_text
          path: _deps/rg_text
          persist-credentials: false

      - name: Install standalone SDL development tools
        shell: pwsh
        run: ./.github/scripts/setup-windows-deps.ps1

      - name: Build tests, validate assets, compile shaders, device target, and all demos
        shell: pwsh
        run: cmd.exe /d /c build.bat test_ci

      - name: Verify shader formats, demos, and compile-only device binary
        shell: pwsh
        run: |
          $formats = @{
            DXIL = '*.dxil'
            SPIRV = '*.spv'
            MSL = '*.msl'
          }
          foreach ($entry in $formats.GetEnumerator()) {
            $directory = Join-Path $env:GITHUB_WORKSPACE "shaders\Compiled\$($entry.Key)"
            $files = @(Get-ChildItem -LiteralPath $directory -File -Filter $entry.Value)
            if ($files.Count -ne 8) {
              throw "Expected 8 $($entry.Key) shaders, found $($files.Count)."
            }
            if ($files | Where-Object { $_.Length -eq 0 }) {
              throw "$($entry.Key) contains an empty shader output."
            }
          }

          foreach ($artifact in @(
            'test_assets.exe',
            'test_demo_profile.exe',
            'test_demo_format.exe',
            'test_gui_no_string_ids.exe',
            'test_gui.exe',
            'test_renderer.exe',
            'test_gui_gpu.exe',
            'test_gui_gpu_sse2.exe',
            'test_gui_gpu_device.exe',
            'test_demo_tearout.exe',
            'rg_gui_demo_minimal.exe',
            'rg_gui_demo_full.exe',
            'rg_gui_demo_tearout.exe'
          )) {
            $path = Join-Path $env:GITHUB_WORKSPACE $artifact
            if (-not (Test-Path -LiteralPath $path -PathType Leaf) -or
                (Get-Item -LiteralPath $path).Length -eq 0) {
              throw "Expected build artifact is missing or empty: $artifact"
            }
          }
          Write-Host 'GPU device execution is intentionally excluded on GitHub-hosted runners.'

  linux:
    name: Linux / ${{ matrix.cc }} build + ASan + UBSan
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    env:
      CC: ${{ matrix.cc }}
      RG_CORE_DIR: ${{ github.workspace }}/_deps/rg_core
      RG_TEXT_DIR: ${{ github.workspace }}/_deps/rg_text

    steps:
      - name: Check out rg_gui
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out rg_core dependency
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: superwendel/rg_core
          path: _deps/rg_core
          persist-credentials: false

      - name: Check out rg_text dependency
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: superwendel/rg_text
          path: _deps/rg_text
          persist-credentials: false

      - name: Build SDL dependency
        id: sdl
        uses: libsdl-org/setup-sdl@afd98199e97f9c2aa739474be7e0886d149a5e47 # Node 24 main, 2026-08-29
        with:
          # Tested CI dependency, not an exact-version requirement for rg_gui.
          version: 147a8ee32dbf9ac02f3794964490687b6bbda1bc # release-3.4.14
          build-type: Release
          install-linux-dependencies: true
          add-to-environment: true

      - name: Configure SDL discovery and X11 lifecycle dependency
        shell: bash
        run: |
          set -euo pipefail
          sdl_prefix='${{ steps.sdl.outputs.prefix }}'
          echo "PKG_CONFIG_PATH=$sdl_prefix/lib/pkgconfig:$sdl_prefix/lib64/pkgconfig:$sdl_prefix/share/pkgconfig:${PKG_CONFIG_PATH:-}" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$sdl_prefix/lib:$sdl_prefix/lib64:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
          sudo apt-get update
          sudo apt-get install --yes libx11-dev

      - name: Build pinned shader compiler dependencies
        shell: bash
        run: ./.github/scripts/setup-linux-deps.sh "$RUNNER_TEMP/rg-gui-linux-deps"

      - name: Validate assets, shaders, host tests, demos, and native test builds
        shell: bash
        run: ./build.sh test_ci

      - name: Run host tests with ASan and UBSan
        shell: bash
        run: ./build.sh test_sanitize

      - name: Verify compile-only device and native artifacts
        shell: bash
        run: |
          set -euo pipefail
          for artifact in test_gui_gpu_device test_demo_tearout rg_gui_demo_minimal rg_gui_demo_full rg_gui_demo_tearout; do
            test -s "out/linux/$artifact"
            test -s "out/linux/$artifact.build.json"
          done
          echo 'GPU/display execution is a local test_release gate; hosted CI only compiles those targets.'
