name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows / MSVC hosted CI gate
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      RG_CORE_DIR: ${{ github.workspace }}\_deps\rg_core
      RG_TEXT_DIR: ${{ github.workspace }}\_deps\rg_text

    steps:
      - name: Check out rg_gui
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out rg_core dependency
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: superwendel/rg_core
          path: _deps/rg_core
          persist-credentials: false

      - name: Check out rg_text dependency
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: superwendel/rg_text
          path: _deps/rg_text
          persist-credentials: false

      - name: Install standalone SDL development tools
        shell: pwsh
        run: ./.github/scripts/setup-windows-deps.ps1

      - name: Build tests, validate assets, compile shaders, device target, and all demos
        shell: pwsh
        run: cmd.exe /d /c build.bat test_ci

      - name: Verify shader formats, demos, and compile-only device binary
        shell: pwsh
        run: |
          $formats = @{
            DXIL = '*.dxil'
            SPIRV = '*.spv'
            MSL = '*.msl'
          }
          foreach ($entry in $formats.GetEnumerator()) {
            $directory = Join-Path $env:GITHUB_WORKSPACE "shaders\Compiled\$($entry.Key)"
            $files = @(Get-ChildItem -LiteralPath $directory -File -Filter $entry.Value)
            if ($files.Count -ne 8) {
              throw "Expected 8 $($entry.Key) shaders, found $($files.Count)."
            }
            if ($files | Where-Object { $_.Length -eq 0 }) {
              throw "$($entry.Key) contains an empty shader output."
            }
          }

          foreach ($artifact in @(
            'test_assets.exe',
            'test_demo_profile.exe',
            'test_demo_format.exe',
            'test_gui_no_string_ids.exe',
            'test_gui.exe',
            'test_renderer.exe',
            'test_gui_gpu.exe',
            'test_gui_gpu_sse2.exe',
            'test_gui_gpu_device.exe',
            'test_demo_tearout.exe',
            'rg_gui_demo_minimal.exe',
            'rg_gui_demo_full.exe',
            'rg_gui_demo_tearout.exe'
          )) {
            $path = Join-Path $env:GITHUB_WORKSPACE $artifact
            if (-not (Test-Path -LiteralPath $path -PathType Leaf) -or
                (Get-Item -LiteralPath $path).Length -eq 0) {
              throw "Expected build artifact is missing or empty: $artifact"
            }
          }
          Write-Host 'GPU device execution is intentionally excluded on GitHub-hosted runners.'

  sanitizers:
    name: Linux / Clang ASan + UBSan
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      RG_CORE_DIR: ${{ github.workspace }}/_deps/rg_core
      RG_TEXT_DIR: ${{ github.workspace }}/_deps/rg_text

    steps:
      - name: Check out rg_gui
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out rg_core dependency
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: superwendel/rg_core
          path: _deps/rg_core
          persist-credentials: false

      - name: Check out rg_text dependency
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: superwendel/rg_text
          path: _deps/rg_text
          persist-credentials: false

      - name: Build SDL test dependency
        id: sdl
        uses: libsdl-org/setup-sdl@afd98199e97f9c2aa739474be7e0886d149a5e47 # Node 24 main, 2026-08-29
        with:
          # Tested CI dependency, not an exact-version requirement for rg_gui.
          version: 147a8ee32dbf9ac02f3794964490687b6bbda1bc # release-3.4.14
          build-type: Release
          install-linux-dependencies: true
          add-to-environment: true

      - name: Build and run host-side sanitizer tests
        shell: bash
        run: |
          set -euo pipefail
          SANITIZER_DIR="$RUNNER_TEMP/rg-gui-sanitize"
          mkdir -p "$SANITIZER_DIR"
          sdl_prefix='${{ steps.sdl.outputs.prefix }}'
          export PKG_CONFIG_PATH="$sdl_prefix/lib/pkgconfig:$sdl_prefix/lib64/pkgconfig:$sdl_prefix/share/pkgconfig:${PKG_CONFIG_PATH:-}"
          test -f "$sdl_prefix/include/SDL3/SDL.h"
          pkg-config --modversion sdl3
          read -r -a sdl_libs <<< "$(pkg-config --libs sdl3)"

          common=(
            -std=gnu11
            -O1
            -g
            -Wall
            -Wextra
            -Werror
            -fno-omit-frame-pointer
            -fno-sanitize-recover=all
            -fsanitize=address,undefined
            -D_CRT_SECURE_NO_WARNINGS
            # Dependency headers expose unused static helpers in unity builds.
            -isystem "$RG_CORE_DIR/src"
            -isystem "$RG_TEXT_DIR/src"
          )
          sdl_common=(
            "${common[@]}"
            -isystem "$sdl_prefix/include"
          )

          clang "${common[@]}" tests/test_assets.c -lm -o "$SANITIZER_DIR/test_assets"
          clang "${sdl_common[@]}" tests/test_gui_no_string_ids.c "${sdl_libs[@]}" -lm -o "$SANITIZER_DIR/test_gui_no_string_ids"
          if clang "${sdl_common[@]}" -DRG_GUI_TEST_EXPECT_STRING_ID_FAILURE \
              tests/test_gui_no_string_ids.c "${sdl_libs[@]}" -lm \
              -o "$SANITIZER_DIR/test_gui_no_string_ids_negative" >/dev/null 2>&1; then
            echo 'RG_GUI_NO_STRING_IDS unexpectedly allowed a disabled string-ID API.' >&2
            exit 1
          fi
          for target in test_gui test_renderer test_gui_gpu test_demo_profile test_demo_format; do
            clang "${sdl_common[@]}" "tests/$target.c" "${sdl_libs[@]}" -lm -o "$SANITIZER_DIR/$target"
          done
          clang "${sdl_common[@]}" -DRG_GUI_GPU_USE_SSE2=1 tests/test_gui_gpu.c "${sdl_libs[@]}" -lm -o "$SANITIZER_DIR/test_gui_gpu_sse2"
          clang "${sdl_common[@]}" tests/test_gui_gpu_device.c "${sdl_libs[@]}" -lm -o "$SANITIZER_DIR/test_gui_gpu_device"

          export ASAN_OPTIONS='detect_leaks=1:halt_on_error=1:strict_string_checks=1'
          export UBSAN_OPTIONS='halt_on_error=1:print_stacktrace=1'
          export SDL_VIDEODRIVER=dummy
          "$SANITIZER_DIR/test_assets"
          "$SANITIZER_DIR/test_gui_no_string_ids"
          "$SANITIZER_DIR/test_demo_profile"
          "$SANITIZER_DIR/test_demo_format"
          "$SANITIZER_DIR/test_gui"
          "$SANITIZER_DIR/test_renderer"
          "$SANITIZER_DIR/test_gui_gpu"
          "$SANITIZER_DIR/test_gui_gpu_sse2"
          echo 'The sanitizer-instrumented GPU device binary was compiled but not run.'
